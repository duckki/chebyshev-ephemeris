[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ephemeris"
version = "0.1.0"
description = "Bounded binary64 ephemeris receiver, optional rational reference, and differential tests"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["ruff==0.16.7"]

[tool.ruff]
target-version = "py311"
required-version = "==0.16.7"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ephemeris", "fuzz", "fuzz.*"]
