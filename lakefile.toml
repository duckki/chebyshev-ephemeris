name = "ephemeris"
version = "0.1.0"
defaultTargets = [
  "Ephemeris",
  "Ephemeris.Tests.ProofAudit",
  "Ephemeris.Tests.PositionReconstruction",
  "Ephemeris.Tests.Message",
  "Ephemeris.Tests.Binary64Value",
  "ephemeris_float_oracle",
]

[leanOptions]
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

[[require]]
name = "leanfmt"
git = "https://github.com/duckki/leanfmt.git"
rev = "v0.4.1"

[[lean_lib]]
name = "Ephemeris"

[[lean_exe]]
name = "ephemeris_float_oracle"
root = "Ephemeris.FuzzOracle.FloatOracle"
